<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quina{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/G3PvK6cN/quina.png">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <img src="https://i.postimg.cc/G3PvK6cN/quina.png" alt="Quina Logo" class="logo">
                <nav>
                    <a href="/" class="nav-link">Resultados</a>
                    <a href="/palpites" class="nav-link">Palpites</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Sistema Quina - Análise por Posição</p>
            <p>Dados oficiais da Caixa Econômica Federal</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
